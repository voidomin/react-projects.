name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            vocab/package-lock.json
            todo-app/package-lock.json
            pokedex/package-lock.json
            caffiend/package-lock.json
            movie-db/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build vocab
        working-directory: ./vocab
        run: npm ci --ignore-scripts && npm run build

      - name: Build todo-app
        working-directory: ./todo-app
        run: npm ci --ignore-scripts && npm run build

      - name: Build pokedex
        working-directory: ./pokedex
        run: npm ci --ignore-scripts && npm run build

      - name: Build caffiend
        working-directory: ./caffiend
        env:
          VITE_FIREBASE_APIKEY: ${{ secrets.VITE_FIREBASE_APIKEY }}
          VITE_FIREBASE_AUTHDOMAIN: ${{ secrets.VITE_FIREBASE_AUTHDOMAIN }}
          VITE_FIREBASE_PROJECTID: ${{ secrets.VITE_FIREBASE_PROJECTID }}
          VITE_FIREBASE_STORAGEBUCKET: ${{ secrets.VITE_FIREBASE_STORAGEBUCKET }}
          VITE_FIREBASE_MESSAGINGSENDERID: ${{ secrets.VITE_FIREBASE_MESSAGINGSENDERID }}
          VITE_FIREBASE_APPID: ${{ secrets.VITE_FIREBASE_APPID }}
        run: npm ci --ignore-scripts && npm run build

      - name: Build movie-db
        working-directory: ./movie-db
        env:
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}
          VITE_IMDB236_RAPIDAPI_KEY: ${{ secrets.VITE_IMDB236_RAPIDAPI_KEY }}
          VITE_MOVIESDB_RAPIDAPI_KEY: ${{ secrets.VITE_MOVIESDB_RAPIDAPI_KEY }}
        run: npm ci --ignore-scripts && npm run build

      - name: Assemble Pages artifact
        run: |
          rm -rf dist-pages
          mkdir -p dist-pages
          cp index.html dist-pages/index.html
          cp style.css dist-pages/style.css
          cp script.js dist-pages/script.js
          cp favicon.svg dist-pages/favicon.svg

          mkdir -p dist-pages/vocab
          cp -r vocab/dist/* dist-pages/vocab/

          mkdir -p dist-pages/todo-app
          cp -r todo-app/dist/* dist-pages/todo-app/

          mkdir -p dist-pages/pokedex
          cp -r pokedex/dist/* dist-pages/pokedex/

          mkdir -p dist-pages/caffiend
          cp -r caffiend/dist/* dist-pages/caffiend/

          mkdir -p dist-pages/movie-db
          cp -r movie-db/dist/* dist-pages/movie-db/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
