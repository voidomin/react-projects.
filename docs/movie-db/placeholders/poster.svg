<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" role="img" aria-labelledby="title desc">
  <title id="title">Poster unavailable</title>
  <desc id="desc">Placeholder poster used when the movie poster is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe5d9" />
      <stop offset="100%" stop-color="#e0d0bf" />
    </linearGradient>
  </defs>
  <rect width="500" height="750" fill="url(#bg)" />
  <g fill="#7a6556" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="150" y="250" width="200" height="250" rx="14" fill="none" stroke="#9b8573" stroke-width="10" />
    <circle cx="250" cy="330" r="42" fill="#9b8573" />
    <rect x="184" y="390" width="132" height="82" rx="14" fill="#9b8573" />
    <text x="250" y="570" font-size="34" font-weight="700">No Poster</text>
    <text x="250" y="610" font-size="22">Image not available</text>
  </g>
</svg>
